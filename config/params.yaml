# All parameter values for the project live here. Change values in this file,
# not in the code. Sections are added as the build progresses.
#
# Model (Carpenter et al. 1999, Eq. 1, dimensionless):
#   dx/dt = a - b*x + x**q / (1 + x**q)

model:
  q: 2.0          # steepness of the sigmoid recycling term
  b: 0.52         # loss rate (sedimentation, outflow)
  a: 0.04         # phosphorus input rate (driver); bistable for b = 0.52 (checked in tests)

baseline:
  # State shown as the "ball" in the Fig. 1a analogue. Deliberately placed away
  # from the clear equilibrium (x_s ~ 0.09) so that precariousness Pr is visibly
  # smaller than latitude L (x_u ~ 0.66).
  x_current: 0.3

numerics:
  n_grid: 2000          # grid points when scanning a function for sign changes
  xtol: 1.0e-12         # absolute tolerance on x for brentq / minimize_scalar
  tangency_tol: 1.0e-12 # |F| at a turning point of F below this counts as a double root (fold)

checks:
  b_folds: 0.52         # b at which the upper and lower folds are checked
  b_window: 0.62        # Carpenter et al.'s "reversible" example (their Fig. 11)
  analytic_tol: 1.0e-7  # tolerance for checks with an exact analytic answer. Not tighter
                        # because the location of the maximum of f' is only determined
                        # to ~sqrt(machine eps): f' is flat there (we get ~1e-8).
  hand_tol: 1.0e-3      # tolerance for the hand-calculated fold values below
  expected_folds_b052:  # hand-calculated, approximate (README.md, "Quantitative checks")
    upper: {a: 0.0735, x: 0.314}
    lower: {a: 0.0196, x: 0.960}
  # Distances delta below the upper fold (at b = b_folds) used to check that
  # resistance R -> 0 and x_s -> x_u as a -> upper fold.
  fold_approach_deltas: [1.0e-4, 1.0e-5, 1.0e-6, 1.0e-7, 1.0e-8]

integration:
  rtol: 1.0e-8          # solve_ivp relative tolerance
  atol: 1.0e-10         # solve_ivp absolute tolerance
  settle_tol: 1.0e-9    # |dx/dt| below this counts as settled at an equilibrium
  settle_t_max: 1.0e4   # give up settling after this much model time

sweep:
  # Slow up-and-down ramp of a for the hysteresis loop (Fig. 3). The loop's
  # shape depends on the rate: jumps lag behind the folds by more when the
  # ramp is faster. Shown in the figure caption; a choice, not a model fact.
  a_min: 0.0
  a_max: 0.1
  rate: 1.0e-5          # da/dt (model time units) for the figure
  lag_rates: [1.0e-3, 1.0e-4, 1.0e-5]  # rates at which the jump lag is reported
  max_step: 1.0         # solve_ivp max step so the forcing is resolved
  n_points: 4000        # output points per half sweep

figures:
  style: polder.mplstyle  # group figure style (repo root)
  formats: [pdf, png]
  x_max: 1.8              # right edge of the landscape plots
  n_x: 800                # points on landscape curves
  # Fig. 1b analogue: values of a for the landscape sequence. The exact upper
  # fold is inserted as an extra panel when include_upper_fold is true.
  sequence_a: [0.02, 0.04, 0.06, 0.07, 0.08]
  include_upper_fold: true
  measures_n_a: 600       # a grid for the resilience-measures figure
  fold_curve_x_max: 6.0   # parametric fold curve: x in (0, fold_curve_x_max]
  fold_curve_n: 6000
  regime_a_max: 0.25      # axes of the q = 2 regime diagram
  regime_b_max: 0.8
  carpenter_q: [2.0, 8.0] # Carpenter et al. Fig. A1: exponents shown
  carpenter_a_max: 1.6    # their axis ranges
  carpenter_b_max: 2.0

demo:
  a_range: [0.0, 0.12]    # slider range for a
  b_range: [0.45, 0.8]    # slider range for b; includes all three regimes
  x_max: 2.6              # right edge of the landscape; above every equilibrium in range
  x_treat: 0.05           # state after "Treat lake chemically" (low phosphorus)
  frame_interval_ms: 30   # animation timer interval
  dt_per_frame: 1.0       # model time shown per animation frame
  max_frames: 90          # cap on frames per relaxation; slow ones play faster
  history_max: 3000       # points kept in the (a, x) trail
  noise_sigma: 0.06       # noise strength (off by default)
  noise_dt: 0.05          # Euler-Maruyama time step
  noise_steps_per_frame: 10

random:
  seed: 20041   # used by every stochastic component (noise in sweeps and demo)
